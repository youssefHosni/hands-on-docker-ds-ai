[project]
name = "ml-app"
version = "0.1.0"
requires-python = ">=3.14"
# What the API needs to serve predictions
dependencies = [
    "fastapi>=0.162.0",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
# What only training needs
train = [
    "pandas>=3.1.0",
]
