services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_DB: mlflow
      # The Postgres image reads the password from this file: the Compose secret
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow", "-d", "mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: ./mlflow
    secrets:
      - db_password
    ports:
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  trainer:
    build: ./trainer
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build: ./api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    depends_on:
      trainer:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  # A web interface for the database, started only with --profile debug
  adminer:
    image: adminer:5.5.1-standalone
    profiles: ["debug"]
    ports:
      - "8080:8080"
    depends_on:
      - db

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  db-data:
  mlflow-artifacts:
