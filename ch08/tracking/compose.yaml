services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mlflow
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mlflow", "-d", "mlflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: ./mlflow
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://mlflow:${POSTGRES_PASSWORD}@db:5432/mlflow
      --artifacts-destination /mlartifacts
      --allowed-hosts mlflow:5000,localhost:5001
    ports:
      - "5001:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  mlflow-artifacts:
